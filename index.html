<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>หมากรุกออนไลน์ - Full Screen</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --danger: #ef4444;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        /* ขยายขนาดกระดานให้ใหญ่ขึ้น */
        #board-container {
            width: 95vw; /* กว้าง 95% ของหน้าจอ */
            max-width: 600px; /* ไม่เกิน 600px เพื่อความสวยงามบนแท็บเล็ต */
            margin: 10px auto;
        }

        #board {
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #334155;
            border-radius: 8px;
        }

        .header { padding: 15px; text-align: center; }
        .header h2 { margin: 0; color: var(--accent); font-size: 24px; }

        .panel {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 15px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 18px;
            text-align: center;
        }

        button {
            width: 95%;
            padding: 14px;
            background: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #status-bar {
            width: 90%;
            max-width: 500px;
            margin: 15px 0;
            padding: 10px;
            background: #334155;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            color: #fbbf24;
        }

        .hidden { display: none; }
        .controls { width: 95%; max-width: 600px; display: flex; gap: 10px; justify-content: center; }
        .btn-reset { background: var(--danger); color: white; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>♟️ CHESS ONLINE</h2>
    </div>

    <div id="lobby" class="panel">
        <p>สร้างหรือจอยห้องเพื่อเล่นกับเพื่อน</p>
        <input type="text" id="room-id" placeholder="ใส่ชื่อห้อง เช่น king123">
        <button onclick="joinRoom()">เริ่มเล่นเลย!</button>
    </div>

    <div id="game-area" class="hidden">
        <div style="margin-bottom: 5px; font-size: 14px; color: #94a3b8;">
            ห้อง: <span id="display-room" style="color:white; font-weight:bold;"></span>
        </div>
        
        <div id="board-container">
            <div id="board"></div>
        </div>

        <div id="status-bar">สถานะ: รอการเคลื่อนไหว...</div>

        <div class="controls">
            <button class="btn-reset" onclick="resetGame()">เริ่มใหม่ (Reset)</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ใช้ข้อมูล Firebase ที่คุณให้มา
        const firebaseConfig = {
            apiKey: "AIzaSyCI7Q5_9eLBuygo3iaYCl6DVUzK5emnPQ4",
            authDomain: "chessss-9dbbe.firebaseapp.com",
            projectId: "chessss-9dbbe",
            storageBucket: "chessss-9dbbe.firebasestorage.app",
            messagingSenderId: "580244581384",
            appId: "1:580244581384:web:e92e42d2bea362eb15b5bd",
            databaseURL: "https://chessss-9dbbe-default-rtdb.firebaseio.com" // ผมเดา URL นี้ให้ตาม Project ID
        };

        // เริ่มต้น Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let board = null;
        let game = new Chess();
        let currentRoom = "";

        function joinRoom() {
            let roomInput = document.getElementById("room-id").value.trim();
            if (!roomInput) return alert("กรุณาตั้งชื่อห้อง");

            currentRoom = roomInput;
            document.getElementById("lobby").classList.add("hidden");
            document.getElementById("game-area").classList.remove("hidden");
            document.getElementById("display-room").innerText = currentRoom;

            initBoard();
            listenToRoom();
        }

        function initBoard() {
            let config = {
                draggable: true,
                position: 'start',
                onDragStart: (source, piece) => {
                    if (game.game_over()) return false;
                    if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                        (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
                },
                onDrop: (source, target) => {
                    let move = game.move({ from: source, to: target, promotion: 'q' });
                    if (move === null) return 'snapback';
                    
                    updateStatus();
                    // บันทึกตำแหน่งลง Firebase
                    database.ref('rooms/' + currentRoom).set({ fen: game.fen() });
                },
                onSnapEnd: () => { board.position(game.fen()); },
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('board', config);
            // ปรับขนาดกระดานอัตโนมัติเมื่อหน้าจอเปลี่ยนขนาด
            $(window).resize(board.resize);
        }

        function updateStatus() {
            let status = '';
            let moveColor = (game.turn() === 'w') ? 'สีขาว' : 'สีดำ';

            if (game.in_checkmate()) status = 'รุกฆาต! ' + moveColor + ' แพ้';
            else if (game.in_draw()) status = 'เสมอ!';
            else {
                status = 'ตาเดิน: ' + moveColor;
                if (game.in_check()) status += ' (เช็ค!)';
            }
            document.getElementById("status-bar").innerText = status;
        }

        function listenToRoom() {
            database.ref('rooms/' + currentRoom).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.fen) {
                    game.load(data.fen);
                    board.position(data.fen);
                    updateStatus();
                }
            });
        }

        function resetGame() {
            if(confirm("คุณต้องการเริ่มเกมใหม่ใช่ไหม?")) {
                game.reset();
                board.start();
                updateStatus();
                database.ref('rooms/' + currentRoom).set({ fen: game.fen() });
            }
        }
    </script>
</body>
</html>
