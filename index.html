<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"
href="https://unpkg.com/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://unpkg.com/chess.js@0.10.3/chess.js"></script>
<script src="https://unpkg.com/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>

body{
background:#1e1e1e;
color:white;
font-family:sans-serif;
text-align:center;
}

#myId{
position:fixed;
top:10px;
right:10px;
background:#333;
padding:10px;
border-radius:10px;
}

#board{
width:350px;
margin:auto;
margin-top:20px;
}

button{
padding:10px;
margin:5px;
}

input{
padding:10px;
}

#challengeBox{
display:none;
background:#333;
padding:15px;
border-radius:10px;
margin-top:10px;
}

</style>

</head>

<body>

<div id="myId">ID: ...</div>

<h2>Chess Duel</h2>

<div id="menu">

<input id="enemyId" placeholder="ใส่รหัสคู่ต่อสู้">

<button onclick="sendChallenge()">ท้าดวล</button>

</div>

<div id="challengeBox">
<h3 id="challengeText"></h3>
<button onclick="acceptChallenge()">ยอมรับ</button>
</div>

<div id="board"></div>

<script>

// Firebase config ของคุณ
var firebaseConfig = {

apiKey: "AIzaSyA2RkFMgSHcyPj7v8dgUJsKhXwQB8rG7FU",
authDomain: "chess-f4404.firebaseapp.com",
databaseURL: "https://chess-f4404-default-rtdb.firebaseio.com/",
projectId: "chess-f4404",
storageBucket: "chess-f4404.firebasestorage.app",
messagingSenderId: "957429600486",
appId: "1:957429600486:web:fbfc378e55667dcfd9eb27"

};

firebase.initializeApp(firebaseConfig);

var db = firebase.database()

var board
var game = new Chess()

var myId = generateId()
var enemyId = ""
var room=""

document.getElementById("myId").innerText="ID: "+myId

listenChallenge()

function generateId(){

const chars="ABCDEFGH123456789"
let id=""

for(let i=0;i<6;i++){

id+=chars[Math.floor(Math.random()*chars.length)]

}

return id

}

function sendChallenge(){

enemyId=document.getElementById("enemyId").value

if(enemyId==""){
alert("ใส่รหัสก่อน")
return
}

db.ref("challenge/"+enemyId).set({

from:myId

})

alert("ส่งคำท้าแล้ว")

}

function listenChallenge(){

db.ref("challenge/"+myId).on("value",function(snapshot){

var data=snapshot.val()

if(data){

enemyId=data.from

document.getElementById("challengeBox").style.display="block"

document.getElementById("challengeText").innerText=
enemyId+" ท้าคุณเล่นหมากรุก"

}

})

}

function acceptChallenge(){

db.ref("challenge/"+myId).remove()

startGame()

}

function startGame(){

document.getElementById("menu").style.display="none"
document.getElementById("challengeBox").style.display="none"

createRoom()

}

function createRoom(){

room=myId+enemyId

db.ref("rooms/"+room).set({

fen:game.fen()

})

listenRoom()

}

function listenRoom(){

db.ref("rooms/"+room).on("value",function(snapshot){

var data=snapshot.val()

if(data){

game.load(data.fen)

board.position(data.fen)

}

})

}

function onDrop(source,target){

var move=game.move({

from:source,
to:target,
promotion:'q'

})

if(move===null) return 'snapback'

db.ref("rooms/"+room).update({

fen:game.fen()

})

}

board = Chessboard("board",{

draggable:true,
position:'start',
onDrop:onDrop

})

</script>

</body>
</html>
