<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Pro Online + Secret Bot</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --white: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); color: var(--white); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #board-container { width: 95vw; max-width: 500px; margin-top: 10px; position: relative; }
        .panel { background: var(--panel); padding: 20px; border-radius: 12px; width: 85%; max-width: 400px; text-align: center; margin-top: 20px; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; text-align: center; }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; margin: 5px; }
        .btn-main { background: var(--accent); color: var(--bg); width: 100%; }
        .btn-white { background: #eee; color: #333; }
        .btn-black { background: #333; color: #eee; }
        .btn-reset { background: #ef4444; color: white; width: 100%; }
        
        /* Highlight Squares */
        .highlight-white { box-shadow: inset 0 0 3px 3px yellow; }
        .highlight-hint { background: rgba(0, 255, 0, 0.3); border-radius: 50%; width: 20px; height: 20px; margin: 25% auto; pointer-events: none; }

        #status-bar { margin: 10px; padding: 10px; background: #334155; border-radius: 8px; font-weight: bold; color: #fbbf24; }
        .hidden { display: none; }

        /* --- ปุ่มลับ (Secret Button) --- */
        #secret-btn {
            position: fixed;
            top: 5px;
            right: 5px;
            width: 30px;
            height: 30px;
            background: transparent; /* โปร่งใส */
            border: none;
            cursor: default;
            z-index: 999;
            color: rgba(255,255,255,0.05); /* แทบมองไม่เห็น */
            font-size: 10px;
        }
        #secret-btn:active { background: rgba(56, 189, 248, 0.2); }
    </style>
</head>
<body>

    <button id="secret-btn" onclick="makeAutoMove()">.</button>

    <h2 style="color: var(--accent);">♟️ CHESS PRO ONLINE</h2>

    <div id="lobby" class="panel">
        <input type="text" id="room-id" placeholder="ระบุชื่อห้อง...">
        <button class="btn-main" onclick="joinRoom()">เข้าห้อง</button>
    </div>

    <div id="side-selector" class="panel hidden">
        <h3>เลือกฝั่ง</h3>
        <p id="room-display"></p>
        <button id="btn-w" class="btn-white" onclick="selectSide('w')">สีขาว</button>
        <button id="btn-b" class="btn-black" onclick="selectSide('b')">สีดำ</button>
    </div>

    <div id="game-area" class="hidden">
        <div id="status-bar">รอเลือกฝั่ง...</div>
        <div id="board-container">
            <div id="board"></div>
        </div>
        <div class="panel" style="margin-top: 10px;">
            <p id="player-info"></p>
            <button id="reset-btn" class="btn-reset" onclick="requestReset()">เริ่มใหม่ (Confirm ทั้งคู่)</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCI7Q5_9eLBuygo3iaYCl6DVUzK5emnPQ4",
            authDomain: "chessss-9dbbe.firebaseapp.com",
            projectId: "chessss-9dbbe",
            storageBucket: "chessss-9dbbe.firebasestorage.app",
            messagingSenderId: "580244581384",
            appId: "1:580244581384:web:e92e42d2bea362eb15b5bd",
            databaseURL: "https://chessss-9dbbe-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let board = null;
        let game = new Chess();
        let mySide = null;
        let currentRoom = "";
        let selectedSquare = null;

        function joinRoom() {
            currentRoom = $('#room-id').val().trim();
            if (!currentRoom) return alert("กรุณาใส่ชื่อห้อง");
            $('#lobby').addClass('hidden');
            $('#side-selector').removeClass('hidden');
            $('#room-display').text("ห้อง: " + currentRoom);
            listenToSides();
        }

        function listenToSides() {
            db.ref('rooms/' + currentRoom + '/players').on('value', (snap) => {
                const p = snap.val() || {};
                if (p.w) $('#btn-w').attr('disabled', true).text('ขาว (ไม่ว่าง)');
                if (p.b) $('#btn-b').attr('disabled', true).text('ดำ (ไม่ว่าง)');
            });
        }

        function selectSide(side) {
            mySide = side;
            db.ref('rooms/' + currentRoom + '/players/' + side).set(true);
            $('#side-selector').addClass('hidden');
            $('#game-area').removeClass('hidden');
            $('#player-info').text("คุณเล่นฝั่ง: " + (side === 'w' ? 'สีขาว' : 'สีดำ'));
            initGame();
        }

        function initGame() {
            const config = {
                position: 'start',
                orientation: mySide === 'w' ? 'white' : 'black',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('board', config);
            
            $('#board').on('click', '.square-55d63', function() {
                const square = $(this).attr('data-square');
                handleSquareClick(square);
            });

            listenToMoves();
            listenToReset();
        }

        function handleSquareClick(square) {
            if (game.turn() !== mySide) return;

            if (selectedSquare === square) {
                removeHighlights();
                selectedSquare = null;
                return;
            }

            const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });

            if (move) {
                syncMove();
            } else {
                const piece = game.get(square);
                if (piece && piece.color === mySide) {
                    selectedSquare = square;
                    showHighlights(square);
                }
            }
        }

        function syncMove() {
            board.position(game.fen());
            db.ref('rooms/' + currentRoom + '/game').set({ fen: game.fen() });
            selectedSquare = null;
            removeHighlights();
        }

        // --- ระบบออโต้ (Bot ลับ) ---
        function makeAutoMove() {
            if (game.turn() !== mySide || game.game_over()) return;

            const possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;

            // สุ่มตาเดินที่ถูกต้อง 1 ตา
            const randomIdx = Math.floor(Math.random() * possibleMoves.length);
            game.move(possibleMoves[randomIdx]);
            
            syncMove();
            console.log("Bot move executed!");
        }

        function showHighlights(square) {
            removeHighlights();
            $(`.square-${square}`).addClass('highlight-white');
            const moves = game.moves({ square: square, verbose: true });
            moves.forEach(m => {
                $(`.square-${m.to}`).append('<div class="highlight-hint"></div>');
            });
        }

        function removeHighlights() {
            $('.square-55d63').removeClass('highlight-white');
            $('.highlight-hint').remove();
        }

        function listenToMoves() {
            db.ref('rooms/' + currentRoom + '/game').on('value', (snap) => {
                const data = snap.val();
                if (data && data.fen) {
                    game.load(data.fen);
                    board.position(data.fen);
                    updateStatus();
                }
            });
        }

        function updateStatus() {
            let status = game.turn() === 'w' ? 'ตาของ: สีขาว' : 'ตาของ: สีดำ';
            if (game.in_checkmate()) status = 'รุกฆาต! จบเกม';
            else if (game.in_draw()) status = 'เสมอ!';
            else if (game.in_check()) status += ' (เช็ค!)';
            $('#status-bar').text(status);
        }

        function requestReset() {
            db.ref('rooms/' + currentRoom + '/reset/' + mySide).set(true);
            alert("ส่งคำขอรีเซ็ตแล้ว...");
        }

        function listenToReset() {
            db.ref('rooms/' + currentRoom + '/reset').on('value', (snap) => {
                const r = snap.val() || {};
                if (r.w && r.b) {
                    game.reset();
                    board.start();
                    db.ref('rooms/' + currentRoom + '/game').set({ fen: game.fen() });
                    db.ref('rooms/' + currentRoom + '/reset').remove();
                }
            });
        }
    </script>
</body>
</html>
