<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Pro Online</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --white: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); color: var(--white); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        #board { width: 95vw; max-width: 480px; margin-top: 10px; }
        .panel { background: var(--panel); padding: 20px; border-radius: 12px; width: 85%; max-width: 400px; text-align: center; margin-top: 20px; }
        
        input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; text-align: center; font-size: 16px; }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px; }
        
        .btn-main { background: var(--accent); color: #0f172a; width: 100%; font-size: 16px; }
        .btn-side { width: 45%; font-size: 16px; }
        .btn-reset { background: #ef4444; color: white; width: 100%; margin-top: 15px; }
        
        #status { margin: 10px; padding: 12px; background: #334155; border-radius: 8px; font-weight: bold; color: #fbbf24; width: 85%; text-align: center; }
        .hidden { display: none !important; }
        
        .highlight-white { box-shadow: inset 0 0 3px 3px yellow; }
        .highlight-hint { background: rgba(0,255,0,0.4); border-radius: 50%; width: 20px; height: 20px; margin: 25% auto; pointer-events: none; }
    </style>
</head>
<body>

    <h2 style="color: var(--accent); margin-top: 20px;">♟️ CHESS PRO ONLINE</h2>

    <div id="lobby" class="panel">
        <input type="text" id="room-id" placeholder="ระบุชื่อห้องออนไลน์...">
        <button class="btn-main" onclick="startOnline()">เข้าห้องออนไลน์</button>
        <button class="btn-main" style="background: #10b981; margin-top: 10px;" onclick="startSingle()">เล่นกับบอท (Single)</button>
    </div>

    <div id="side-selector" class="panel hidden">
        <h3>เลือกฝั่งของคุณ</h3>
        <button id="btn-w" class="btn-side" style="background:#eee; color:#333;" onclick="setSide('w')">สีขาว</button>
        <button id="btn-b" class="btn-side" style="background:#333; color:#eee;" onclick="setSide('b')">สีดำ</button>
    </div>

    <div id="game-area" class="hidden" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <div id="status">เตรียมพร้อม...</div>
        <div id="board"></div>
        <div class="panel">
            <p id="info-text"></p>
            <button class="btn-reset" onclick="location.reload()">ออกเกม / เริ่มใหม่</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyCI7Q5_9eLBuygo3iaYCl6DVUzK5emnPQ4",
            authDomain: "chessss-9dbbe.firebaseapp.com",
            projectId: "chessss-9dbbe",
            storageBucket: "chessss-9dbbe.firebasestorage.app",
            messagingSenderId: "580244581384",
            appId: "1:580244581384:web:e92e42d2bea362eb15b5bd",
            databaseURL: "https://chessss-9dbbe-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let board, game = new Chess();
        let mySide = 'w', currentRoom = "", isSingle = false, selected = null;

        // --- ระบบสลับหน้า ---
        function startOnline() {
            currentRoom = $('#room-id').val().trim();
            if(!currentRoom) return alert("กรุณาใส่ชื่อห้อง");
            isSingle = false;
            $('#lobby').addClass('hidden');
            $('#side-selector').removeClass('hidden');
            
            // เช็คว่ามีคนจองสีหรือยัง
            db.ref('rooms/'+currentRoom+'/p').on('value', s => {
                const p = s.val() || {};
                if(p.w) $('#btn-w').attr('disabled', true).text('ขาว (เต็ม)');
                if(p.b) $('#btn-b').attr('disabled', true).text('ดำ (เต็ม)');
            });
        }

        function startSingle() {
            isSingle = true;
            $('#lobby').addClass('hidden');
            $('#side-selector').removeClass('hidden');
        }

        function setSide(s) {
            mySide = s;
            if(!isSingle) db.ref('rooms/'+currentRoom+'/p/'+s).set(true);
            $('#side-selector').addClass('hidden');
            $('#game-area').removeClass('hidden');
            $('#info-text').text("ฝั่งของคุณ: " + (s==='w'?'สีขาว':'สีดำ'));
            
            setTimeout(initGame, 300);
        }

        // --- เริ่มเกม ---
        function initGame() {
            board = Chessboard('board', {
                position: 'start',
                orientation: mySide === 'w' ? 'white' : 'black',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            $('#board').on('click', '.square-55d63', function() {
                clickSquare($(this).attr('data-square'));
            });

            if(!isSingle) {
                // ฟังเสียงเดินจาก Firebase
                db.ref('rooms/'+currentRoom+'/game').on('value', s => {
                    const d = s.val();
                    if(d && d.fen) {
                        game.load(d.fen);
                        board.position(d.fen);
                        updateStatus();
                    }
                });
            }
            updateStatus();
        }

        function clickSquare(sq) {
            if(game.turn() !== mySide || game.game_over()) return;

            let move = game.move({ from: selected, to: sq, promotion: 'q' });

            if(move) {
                board.position(game.fen());
                if(!isSingle) db.ref('rooms/'+currentRoom+'/game').set({ fen: game.fen() });
                selected = null;
                removeHighlight();
                updateStatus();
                if(isSingle) setTimeout(botMove, 500);
            } else {
                let p = game.get(sq);
                if(p && p.color === mySide) {
                    selected = sq;
                    showMoves(sq);
                }
            }
        }

        function showMoves(sq) {
            removeHighlight();
            $(`.square-${sq}`).addClass('highlight-white');
            game.moves({square:sq, verbose:true}).forEach(m => {
                $(`.square-${m.to}`).append('<div class="highlight-hint"></div>');
            });
        }

        function removeHighlight() {
            $('.square-55d63').removeClass('highlight-white');
            $('.highlight-hint').remove();
        }

        function botMove() {
            if(game.game_over()) return;
            let moves = game.moves({verbose:true});
            let best=null, bestScore=-999;
            let val={p:1,n:3,b:3,r:5,q:9,k:100};
            moves.forEach(m=>{
                let score=Math.random();
                if(m.captured) score+=val[m.captured]||0;
                if(score>bestScore){bestScore=score;best=m;}
            });
            game.move(best);
            board.position(game.fen());
            updateStatus();
        }

        function updateStatus() {
            let t = game.turn()==='w' ? 'ตาของ: สีขาว' : 'ตาของ: สีดำ';
            if(game.in_checkmate()) t = 'รุกฆาต! จบเกม';
            if(game.in_draw()) t = 'เสมอ!';
            $('#status').text(t);
        }
    </script>
</body>
</html>
